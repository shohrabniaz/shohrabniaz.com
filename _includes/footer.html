<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <p class="footer-name">Shohrab Hossen Niaz</p>
      <p class="footer-tag">{{ site.location }}</p>
    </div>
    <nav class="footer-links" aria-label="Footer">
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="https://github.com/{{ site.github_username }}" rel="me noopener" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" rel="me noopener" target="_blank">LinkedIn</a>
      <a href="{{ site.profiles.scholar }}" rel="me noopener" target="_blank">Google Scholar</a>
      {%- if site.orcid_id -%}<a href="https://orcid.org/{{ site.orcid_id }}" rel="me noopener" target="_blank">ORCID</a>{%- endif -%}
    </nav>
  </div>
  <div class="wrap footer-copy">
    <p>&copy; {{ 'now' | date: "%Y" }} Shohrab Hossen Niaz. Built with Jekyll &amp; hosted on GitHub Pages.</p>
  </div>
</footer>
