# ----------------------------------------------------------------------------
# Site settings — custom domain (www.shohrabniaz.com)
# Root CNAME file points GitHub Pages at www.shohrabniaz.com.
# See README.md for Cloudflare DNS records + apex redirect.
# ----------------------------------------------------------------------------
url: "https://www.shohrabniaz.com"
baseurl: ""

title: "Shohrab Hossen Niaz"
tagline: "Cyber Security researcher & Senior DevOps / Platform Engineer"
description: >-
  Shohrab Hossen Niaz (Niaz) — MSc Cyber Security & Forensics researcher at the
  University of the Sunshine Coast and Senior DevOps, Platform & Cloud Security
  Engineer in Adelaide, South Australia. Research in LLM-driven security repair
  of Infrastructure-as-Code and cloud-native DevSecOps.
author: "Shohrab Hossen Niaz"
lang: en

# Contact / social
email: "niaz@shohrabniaz.com"
location: "Adelaide, South Australia"
github_username: "shohrabniaz"
linkedin_username: "shohrabniaz"
orcid_id: "0009-0003-3036-4382"

# Verified public profiles (rel=me + Contact page + Person sameAs)
# Intentionally omit Facebook, Instagram, and the legacy github.io site.
profiles:
  github: "https://github.com/shohrabniaz"
  linkedin: "https://www.linkedin.com/in/shohrabniaz/"
  scholar: "https://scholar.google.com/citations?user=V3Vwc2EAAAAJ"
  orcid: "https://orcid.org/0009-0003-3036-4382"

# CV downloads
academic_cv: "assets/pdf/Shohrab-Hossen-Niaz_Academic-CV.pdf"
industry_cv: "assets/pdf/Shohrab-Hossen-Niaz_Industry-CV.pdf"

# SEO / social preview — no X/Twitter handle; omit twitter.username so
# jekyll-seo-tag does not emit twitter:site. twitter:creator is suppressed via
# a post-seo strip in _includes/head.html.
image: "/assets/img/og-image.png"

# Used by jekyll-seo-tag (author / sameAs consistency with Person schema)
social:
  name: "Shohrab Hossen Niaz"
  links:
    - "https://github.com/shohrabniaz"
    - "https://www.linkedin.com/in/shohrabniaz/"
    - "https://scholar.google.com/citations?user=V3Vwc2EAAAAJ"
    - "https://orcid.org/0009-0003-3036-4382"

# Apply the social preview image to every page (jekyll-seo-tag reads page.image).
# Exclude CV PDFs from jekyll-sitemap (static files under assets/pdf).
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/img/og-image.png"
  - scope:
      path: "assets/pdf"
    values:
      sitemap: false

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  # jekyll-feed omitted: no blog posts; an empty Atom feed is misleading.

# Navigation (ordered)
nav:
  - name: About
    link: /
  - name: Research
    link: /research/
  - name: Experience
    link: /experience/
  - name: Projects
    link: /projects/
  - name: CV
    link: /cv/
  - name: Contact
    link: /contact/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
  - build.py
  - "*.gem"
  - uploads
  - "*.docx"
